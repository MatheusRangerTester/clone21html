<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Website</title>

  <link rel="icon" type="image/x-icon" href="image.png">
  <link rel="stylesheet" href="style1.css">
</head>

<body>

  <!-- NAVIGATION -->
  <nav id="navbar">

    <a href="#home" class="logo">LOGO</a>

    <div class="nav-links">
      <a href="#about">ABOUT</a>
      <a href="#work">WORK</a>
      <a href="#contact">CONTACT</a>
    </div>

  </nav>


  <!-- HOME -->
  <section
    id="home"
    class="section home"
    data-nav-color="#111111"
    data-nav-text="#ffffff"
  >

    <div class="section-content">
      <p class="eyebrow">WELCOME</p>
      <h1>MY<br>WEBSITE</h1>
      <p class="scroll-text">SCROLL TO EXPLORE ↓</p>
    </div>

  </section>


  <!-- ABOUT -->
  <section
    id="about"
    class="section about"
    data-nav-color="#d9c7a8"
    data-nav-text="#111111"
  >

    <div class="section-content">
      <p class="eyebrow">01 — ABOUT</p>
      <h2>Something<br>Interesting.</h2>
      <p class="description">
        This is where you can introduce yourself, your work,
        your project, or whatever this website is about.
      </p>
    </div>

  </section>


  <!-- WORK -->
  <section
    id="work"
    class="section work"
    data-nav-color="#8b2020"
    data-nav-text="#ffffff"
  >

    <div class="section-content">
      <p class="eyebrow">02 — WORK</p>
      <h2>Selected<br>Work.</h2>
    </div>

  </section>


  <!-- CONTACT -->
  <section
    id="contact"
    class="section contact"
    data-nav-color="#e5e1d8"
    data-nav-text="#111111"
  >

    <div class="section-content">
      <p class="eyebrow">03 — CONTACT</p>
      <h2>Let's Talk.</h2>
    </div>

  </section>


  <script src="script.js"></script>

</body>
</html>
